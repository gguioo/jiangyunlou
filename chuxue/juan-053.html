<h1>初學集·墓誌銘（七）</h1>
<p>明故整飭遼陽等處海防監督朝鮮軍務山東按察司按察使蕭公墓誌銘</p>
<p>貴州布政使司監軍都清道右參議兼僉事贈亞中大夫貴州布政使司右參政陳府君墓誌銘</p>
<p>故淮府左長史何公墓誌銘</p>
<p>明故陝西按察司按察使徐公墓誌銘</p>
<p>明故沔陽州知州徐君墓誌銘</p>
<p>廣西平樂府同知致仕進階朝列大夫陸君墓誌銘</p>
<p>明故浙江溫州府平陽縣知縣陸君墓誌銘</p>
<p>誥封中大夫廣東按察司按察使孫君墓誌銘</p>
<p>東昌府通判王君墓誌銘</p>
<p>天河公生壙誌</p>
