<h1>初學集·疏</h1>
<p>蒙恩昭雪恭伸辭謝微悃疏</p>
<p>微臣束身就係，輔臣蜚語橫加，謹平心剖質，仰祈聖明洞鑒疏</p>
<p>剖明關節始末，以祈聖鑒、以明臣節疏</p>
<p>微臣荷恩誼重、戀主情深，謹瀝丹誠，仰祈天鑒疏</p>
<p>遵旨回話疏</p>
<p>議</p>
<p>輸丁議</p>
<p>與楊明府論編審</p>
<p>與蔣明府論優免事宜</p>
<p>請調用閩帥議</p>
