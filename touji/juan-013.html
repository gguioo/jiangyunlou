<h1>投筆集·吟罷自題長句撥悶二首（壬寅三月二十九日）</h1>
<h3>其一</h3>
<p>孤臣澤畔自行歌，爛熳篇章費折磨。似讔似俳還似讖，非狂非醉又非魔。嘔心自笑才華盡，捫腹其如倔強何？二祖歷宗恩養士，幾人吟咀淚痕多？</p>
<h3>其二</h3>
<p>不成悲泣不成歌，破硯還如墨盾磨。拌以餘生供漫興，欲將秃筆掃羣魔。途窮日暮聊爲爾，髮短心長可奈何？賦罷無衣方卒哭，百篇號踴未云多。</p>
