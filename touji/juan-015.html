<h1>投筆集·癸卯中夏六日重題長句二首</h1>
<h3>其一</h3>
<p>漫漫長夜獨悲歌，孤憤填胸肯自磨？敵對災星憑酒伯，破除愁壘仗詩魔。逢人每道君休矣，顧影還呼汝謂何。欲共老漁開口笑，商量何處水天多。</p>
<h3>其二</h3>
<p>百篇學杜擬商歌，墨瀋頻將漬淚磨。世難相尋如鬼疰，國恩未報是心魔。射潮霸主吾衰矣，觀井仙人奈老何？取次長謠向空濶，江天雲物爲誰多？</p>
